# render.yaml — https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: erp-django-utec
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: gunicorn core.wsgi --workers 2 --timeout 120 --log-file -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-django-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: erp-django-db
    databaseName: erp_db
    user: erp_user
    plan: free
    region: oregon
