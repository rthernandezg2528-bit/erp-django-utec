{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block extra_css %}
<style>
    .login-wrap { max-width: 440px; margin: 2rem auto; }
    .login-card {
        background: #1B0826;
        border: 1.5px solid #FF2E93;
        border-radius: 20px;
        padding: 2.25rem 2rem;
        color: #F6D9EE;
        box-shadow: 0 0 22px rgba(255,46,147,.45), 0 0 70px rgba(176,76,255,.25),
                    inset 0 0 20px rgba(255,46,147,.10);
        text-align: center;
    }
    .login-card .calavera {
        font-size: 3.4rem;
        filter: drop-shadow(0 0 10px #FF2E93) drop-shadow(0 0 24px #FF9A1F);
    }
    .login-card h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        margin: .25rem 0 1.5rem;
        color: #FFF3F8;
        text-shadow: 0 0 6px #fff, 0 0 16px #FF2E93, 0 0 36px #FF2E93;
    }
    .login-card .campo { text-align: left; margin-bottom: 1.1rem; }
    .login-card label { color: #F6D9EE; font-weight: 600; font-size: .88rem; margin-bottom: .3rem; display: block; }
    .login-card input[type="text"],
    .login-card input[type="password"] {
        width: 100%;
        background: #12041A;
        color: #FFF3F8;
        border: 1.5px solid #B04CFF;
        border-radius: 10px;
        padding: .6rem .9rem;
        font-size: .95rem;
    }
    .login-card input:focus {
        outline: none;
        border-color: #FF9A1F;
        box-shadow: 0 0 0 3px rgba(255,154,31,.35), 0 0 14px rgba(255,154,31,.5);
    }
    .login-card .btn-neon {
        width: 100%;
        margin-top: .5rem;
        padding: .75rem;
        border-radius: 999px;
        font-weight: 700;
        color: #fff;
        background: transparent;
        border: 2px solid #FF9A1F;
        box-shadow: 0 0 14px rgba(255,154,31,.55), inset 0 0 14px rgba(255,154,31,.25);
        text-shadow: 0 0 8px rgba(255,154,31,.9);
        cursor: pointer;
        transition: background .2s, color .2s;
    }
    .login-card .btn-neon:hover { background: #FF9A1F; color: #2A1236; text-shadow: none; }
    .login-card .error {
        background: rgba(255,107,107,.12);
        border: 1px solid #FF6B6B;
        color: #FFB3B3;
        border-radius: 10px;
        padding: .6rem .9rem;
        margin-bottom: 1rem;
        font-size: .9rem;
        text-align: left;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="calavera" aria-hidden="true">💀</div>
        <h1>Iniciar sesión</h1>

        {% if form.errors %}
        <div class="error">⚠️ Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="campo">
                <label for="id_username">👤 Usuario</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="campo">
                <label for="id_password">🔑 Contraseña</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit" class="btn-neon">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
